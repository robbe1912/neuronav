name: openhands-unclaim

# When a real PR arrives that closes an issue carrying a placeholder claim,
# close the placeholder so exactly one PR tracks the work.
on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write
  issues: write

jobs:
  unclaim:
    if: github.event.pull_request.user.type == 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Find issue number targeted by the bot PR
        id: issue
        run: |
          ISSUE=$(echo "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' | grep -oE '[0-9]+' | head -1 || true)
          echo "number=$ISSUE" >> "$GITHUB_OUTPUT"
        env:
          BODY: ${{ github.event.pull_request.body }}

      - name: Close the placeholder draft if present
        if: steps.issue.outputs.number != ''
        run: |
          gh pr close "agent/issue-${ISSUE}" --comment "Superseded by the agent's real PR ${REAL} — placeholder closed." || echo "no placeholder found"
          gh issue edit "${ISSUE}" --remove-label "agent:openhands" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ steps.issue.outputs.number }}
          REAL: ${{ github.event.pull_request.html_url }}
