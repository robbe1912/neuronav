name: coderabbit-trigger

# <10-star repos require manual CodeRabbit review triggers; OSS allowance is
# 1 review/hour at this star count. Fire the trigger once, at ready-flip —
# drafts stay free (excluded by default), one review per PR.
on:
  pull_request:
    types: [ready_for_review]

permissions:
  pull-requests: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - run: gh pr comment "$PR" --body "@coderabbitai review"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
