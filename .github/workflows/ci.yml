name: tests
on:
  push:
    branches: [main]
  pull_request:

# superseded pushes burn a ~5min viz job each — cancel per-ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      NEURONAV_EMBED_FAKE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # issue #247: install the DECLARED set — the tested matrix is the
      # pyproject pin set (`pip install -e .`), not a floating unpinned
      # list that quietly drifts off it (the old 3.11 + unpinned combo
      # never tested the pins as a set). `build` is the one test-side
      # append (test_packaging's preferred wheel builder).
      - run: pip install -e . build
      - name: strata (depth layering, cycles, determinism)
        run: python -X utf8 tests/test_strata.py
      - name: crosslang (self-index integration, deterministic fake embeddings)
        run: python -X utf8 tests/test_crosslang.py
      - name: pyhard (python extractor edge cases)
        run: python -X utf8 tests/test_pyhard.py
      - name: cpphard (C++ extractor edge cases)
        run: python -X utf8 tests/test_cpphard.py
      - name: jshard (JavaScript extractor edge cases, issue #277)
        run: python -X utf8 tests/test_jshard.py
      - name: autorescan (stat-gate freshness, watcher, stdio e2e)
        run: python -X utf8 tests/test_autorescan.py
      # issue #180: stdio E2E without any committed store — the suite
      # self-bootstraps the self-index under FAKE embeds when the
      # checkout has no config (count==0 rescan, the #166 precedent),
      # then drives drift/stat-gate/routed-freshness/recall-knob/degraded
      # scenarios over real pipes on hermetic scratch trees.
      - name: server-stdio (MCP e2e drift, stat-gate, routed freshness, recall knobs, degraded shapes — issue #180)
        run: python -X utf8 tests/test_server_stdio.py
      - name: searchtext (capped regex text search tool, issue #68)
        run: python -X utf8 tests/test_searchtext.py
      - name: project-mode (onboarding, discovery precedence, viz-as-addon)
        run: python -X utf8 tests/test_project_mode.py
      - name: baseindex (export/import shards, second-run idempotence, issue #102)
        run: python -X utf8 tests/test_baseindex.py
      - name: mwires (named-wire map rows, map-spec-v2 §0)
        run: python -X utf8 tests/test_mwires.py
      - name: clusterinv (partition invariant + crosstalk parity, issue #114)
        run: python -X utf8 tests/test_clusterinv.py
      - name: archrules (arch-rule engine over crosstalk, issue #70)
        run: python -X utf8 tests/test_archrules.py
      - name: recall (vector recall two-pass, fake embeddings)
        run: python -X utf8 tests/test_recall.py
      - name: embedprov (embed provider auth + probe)
        run: python -X utf8 tests/test_embedprov.py
      - name: repomap (repo map budget, stdlib + numpy)
        run: python -X utf8 tests/test_repomap.py
      - name: selfindex (structural self-index checks)
        run: python -X utf8 tests/test_selfindex.py
      # issue #180: the explore funnel against the self-index store —
      # same hermetic bootstrap as above when the store is empty.
      - name: explore (funnel e2e on the hermetic selfindex — issue #180)
        run: python -X utf8 tests/test_explore.py
      - name: verifier (tree-sitter verifier, hermetic by construction)
        run: python -X utf8 tests/test_verifier.py
      - name: bench (record/golden coherence, issue #104)
        run: python -X utf8 tests/test_bench.py
      - name: bakeint (empty-store refusal, splice hardening, atomic write, issues #64/#108)
        run: python -X utf8 tests/test_bakeint.py
      - name: portability (BOM-tolerant config reads, git utf-8 decode, console encoding, issue #119)
        run: python -X utf8 tests/test_portability.py
      - name: bytelaws (importmap vendored-bytes pin, UTF-8-no-BOM write law, issue #124)
        run: python -X utf8 tests/test_bytelaws.py
      - name: walkguard (rescan walk + write robustness, issue #117)
        run: python -X utf8 tests/test_walkguard.py
      - name: langsep (registry-only language facts in shared modules)
        run: python -X utf8 tests/test_langsep.py
      - name: delegates (pure-delegate duplicate filter, issue #268)
        run: python -X utf8 tests/test_delegates.py
      - name: bootgate (handshake precedes boot work, issue #273)
        run: python -X utf8 tests/test_bootgate.py
      - name: impact (transitive blast-radius walk, issue #280)
        run: python -X utf8 tests/test_impact.py
      # issue #120/#124: serve.py bake-only surface + qa gate smoke. Leg B
      # (playwright battery) skips here via the flag — the viz job below
      # re-runs this suite with the browser available.
      - name: qa smoke leg A (serve.py allowlist, issues #120/#124-3)
        run: python -X utf8 tests/test_qa_smoke.py
        env:
          NEURONAV_QA_SMOKE_NO_BROWSER: "1"
      # issue #204: the uvx contract — wheel build, scratch-venv install,
      # installed neuronav-mcp on a config-less fixture repo over stdio
      # (initialize + tools/list + repo_map + the #203 pre-rescan banner)
      - name: packaging (wheel + installed console script, issue #204)
        run: python -X utf8 tests/test_packaging.py

  # test_viz on the frozen synthetic corpus (issue #100/#97/#146): bake a
  # hermetic store (fake embeds, scratch config + state dir) and gate the
  # ~9.7k-line viz template end-to-end in a real browser. The corpus is
  # generated from fixed content by tests/vizcorpus_build.py - no target
  # repo, no live store, deterministic bytes.
  viz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      NEURONAV_EMBED_FAKE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # issue #247: declared set via -e . ; playwright is the test-side append
      - run: pip install -e . playwright
      - run: python -m playwright install --with-deps chromium
      - name: build frozen corpus (git history + fake-embed store + bake)
        run: python -X utf8 tests/vizcorpus_build.py --dest "$HOME/vizcorpus"
      - name: test_viz on the frozen corpus
        run: NEURONAV_CONFIG="$HOME/vizcorpus/config.json" python -X utf8 tests/test_viz.py
      - name: qa smoke leg B (declutter battery over a hermetic bake)
        run: python -X utf8 tests/test_qa_smoke.py
